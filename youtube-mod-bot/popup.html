<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mod Bot</title>
  <style>
    :root { color-scheme: light dark; }
    body { width: 340px; margin: 0; padding: 14px; font: 13px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    h1 { font-size: 14px; margin: 0; }
    .switch { display: flex; align-items: center; gap: 7px; font-size: 12.5px; }
    .banner { margin: 11px 0 0; padding: 7px 9px; border-radius: 5px; font-size: 12px; background: #f5a62322; border: 1px solid #f5a62366; }
    .stats { display: flex; gap: 6px; margin: 12px 0 10px; text-align: center; }
    .stat { flex: 1; padding: 7px 4px; border: 1px solid #8886; border-radius: 6px; }
    .stat b { display: block; font-size: 17px; }
    .stat span { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; opacity: .65; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; opacity: .65; margin: 12px 0 6px; }
    ul { list-style: none; margin: 0; padding: 0; max-height: 210px; overflow-y: auto; }
    li { padding: 6px 0; border-top: 1px solid #8883; font-size: 12px; }
    li .who { font-weight: 600; }
    li .what { opacity: .75; word-break: break-word; }
    li .kind { font-size: 10px; text-transform: uppercase; letter-spacing: .04em; padding: 1px 5px; border-radius: 3px; background: #8883; }
    .kind.deleted { background: #e5484d33; }
    .kind.wouldDelete { background: #f5a62333; }
    .kind.answered { background: #30a46c33; }
    .kind.error { background: #e5484d55; }
    .empty { opacity: .6; padding: 10px 0; font-size: 12px; }
    .modes { display:flex; gap:4px; margin:10px 0 0; }
    .modes button { flex:1; padding:6px 2px; font:inherit; font-size:11px; font-weight:600; border-radius:6px;
                    border:1px solid #8886; background:#8881; color:inherit; cursor:pointer; }
    .modes button[aria-pressed="true"] { background:#065fd4; border-color:#065fd4; color:#fff; }
    .packs { margin:11px 0 0; padding:9px; border:1px solid #8886; border-radius:7px; }
    .packs .head { display:flex; align-items:baseline; gap:7px; }
    .packs .n { font-size:21px; font-weight:700; line-height:1; }
    .packs .lbl { font-size:10px; text-transform:uppercase; letter-spacing:.05em; opacity:.65; }
    .packs .add { display:flex; gap:5px; margin-top:7px; }
    .packs .add input { flex:1; min-width:0; padding:7px 8px; font:inherit; border:1px solid #8886; border-radius:6px; background:#8881; color:inherit; }
    .packs .add button { padding:0 12px; border:none; border-radius:6px; background:#30a46c; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    .packs .bar { display:flex; justify-content:space-between; font-size:11.5px; padding:2px 0; border-top:1px solid #8883; }
    .packs .tools { display:flex; gap:9px; margin-top:6px; }
    .packs textarea { width:100%; box-sizing:border-box; margin-top:7px; min-height:44px; resize:vertical;
                      padding:6px 8px; font:inherit; font-size:12px; border:1px solid #8886; border-radius:6px; background:#8881; color:inherit; }
    .hold { margin:9px 0 0; padding:9px; border:1px solid #4c8dff; border-radius:7px; background:#4c8dff1f; }
    .hold .msg { margin:3px 0 7px; word-break:break-word; font-size:12.5px; }
    .hold .acts { display:flex; gap:6px; }
    .hold .acts button { flex:1; padding:8px; border:none; border-radius:6px; font:inherit; font-weight:700; cursor:pointer; }
    .hold .del { background:#e5484d; color:#fff; }
    .hold .keep { background:#8883; color:inherit; }
    .tag.timeout, .tag.ban { background:#e5484d55; }
    .tag.pack, .tag.kept { background:#30a46c33; }
    footer { margin-top: 12px; display: flex; gap: 10px; }
    a { color: #3b82f6; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>YouTube Live Chat Mod Bot</h1>
    <label class="switch"><input type="checkbox" id="enabled"> On</label>
  </header>

  <div class="modes">
    <button data-mode="dry">Dry run</button>
    <button data-mode="hold">Ask me</button>
    <button data-mode="auto">Auto</button>
  </div>

  <div class="banner" id="dry" hidden><strong>Dry run</strong> — matches are logged, nothing is deleted.</div>
  <div class="banner" id="nokey" hidden><strong>No API key</strong> — questions can't be answered yet.</div>

  <div id="holds"></div>

  <section class="packs">
    <div class="head"><span class="n" id="pack-total">0</span><span class="lbl">packs opened</span></div>
    <div class="add">
      <input id="pack-name" placeholder="Pack name" autocomplete="off">
      <button id="pack-add">+1</button>
    </div>
    <div id="pack-bars"></div>
    <div class="tools"><a id="pack-undo">Undo last</a><a id="pack-reset">Reset tally</a></div>
    <textarea id="pack-context" placeholder="Notes for the bot — what you're opening, the goal, anything viewers keep asking."></textarea>
  </section>

  <div class="stats">
    <div class="stat"><b id="s-deleted">0</b><span>Deleted</span></div>
    <div class="stat"><b id="s-wouldDelete">0</b><span>Would</span></div>
    <div class="stat"><b id="s-answered">0</b><span>Answered</span></div>
    <div class="stat"><b id="s-timeouts">0</b><span>Timeouts</span></div>
    <div class="stat"><b id="s-bans">0</b><span>Bans</span></div>
    <div class="stat"><b id="s-errors">0</b><span>Errors</span></div>
  </div>

  <h2>Recent activity</h2>
  <ul id="log"></ul>
  <p class="empty" id="empty" hidden>Nothing yet. Open a live chat you moderate.</p>

  <footer>
    <a id="options">Settings</a>
    <a id="clear">Clear log</a>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
