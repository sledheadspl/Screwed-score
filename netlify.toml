[build]
  command = "npm run build"
  publish = ".next"

[functions."*"]
  timeout = 26

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Pings IndexNow (Bing and friends) with the live sitemap after each
# production deploy. Never fails the build. See netlify/plugins/indexnow.
[[plugins]]
  package = "./netlify/plugins/indexnow"
